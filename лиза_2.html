<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Лиза 🌸</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@300;400&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0018;
    font-family: 'Montserrat', sans-serif;
  }

  /* ========== CANVAS STARS ========== */
  #sky { position: fixed; inset: 0; z-index: 0; }

  /* ========== ЛУНА ========== */
  #moon {
    position: fixed;
    width: 90px; height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff8e1, #ffe082 60%, #ffb300);
    box-shadow: 0 0 40px 20px rgba(255,220,80,0.25), 0 0 100px 40px rgba(255,180,0,0.1);
    top: 6vh; right: 8vw;
    z-index: 1;
    animation: moonFloat 8s ease-in-out infinite;
  }
  @keyframes moonFloat {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-12px); }
  }

  /* ========== СВЕТЛЯЧКИ ========== */
  .fly {
    position: fixed;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #b9ff6a;
    box-shadow: 0 0 8px 4px rgba(180,255,80,0.7);
    z-index: 2;
    pointer-events: none;
    animation: flyMove linear infinite, flyBlink ease-in-out infinite;
  }
  @keyframes flyBlink {
    0%,100% { opacity: 0.15; box-shadow: 0 0 4px 2px rgba(180,255,80,0.3); }
    50%     { opacity: 1;    box-shadow: 0 0 14px 6px rgba(180,255,80,0.9); }
  }
  @keyframes flyMove {
    0%   { transform: translate(0,0); }
    25%  { transform: translate(var(--mx1),var(--my1)); }
    50%  { transform: translate(var(--mx2),var(--my2)); }
    75%  { transform: translate(var(--mx3),var(--my3)); }
    100% { transform: translate(0,0); }
  }

  /* ========== ЭКРАН 1: КНОПКА ========== */
  #screen1 {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 28px;
    z-index: 10;
    transition: opacity 1s ease;
  }
  #screen1 h1 {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(28px, 8vw, 46px);
    color: #f9d0e8;
    text-shadow: 0 0 30px rgba(255,150,200,0.6);
    animation: fadeUp 1.2s ease both;
    text-align: center;
    padding: 0 20px;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  #startBtn {
    font-family: 'Dancing Script', cursive;
    font-size: 22px;
    color: #fff;
    background: none;
    border: 1.5px solid rgba(255,180,220,0.7);
    border-radius: 50px;
    padding: 14px 38px;
    cursor: pointer;
    letter-spacing: 1px;
    position: relative;
    overflow: hidden;
    animation: fadeUp 1.4s ease both;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s;
  }
  #startBtn::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,180,220,0.15), transparent);
    transform: translateX(-100%);
    animation: shimmer 2.5s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  #startBtn:active { transform: scale(0.96); }

  /* ========== ЛЕПЕСТКИ ========== */
  .petal {
    position: fixed;
    top: -40px;
    font-size: 18px;
    z-index: 3;
    pointer-events: none;
    animation: petalFall linear infinite;
    opacity: 0;
  }
  @keyframes petalFall {
    0%   { transform: translateY(0) rotate(0deg) translateX(0);   opacity: 0; }
    8%   { opacity: 0.9; }
    85%  { opacity: 0.8; }
    100% { transform: translateY(115vh) rotate(720deg) translateX(var(--sway)); opacity: 0; }
  }

  /* ========== ЭКРАН 2: ПРИЗНАНИЕ ========== */
  #screen2 {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 10;
    opacity: 0; pointer-events: none;
    transition: opacity 1.2s ease;
    padding: 30px 20px;
    gap: 0;
  }
  #screen2.show {
    opacity: 1; pointer-events: all;
  }

  /* Большое сердце SVG */
  #heartSvg {
    width: min(260px, 70vw);
    animation: heartBeat 1.4s ease-in-out infinite;
    filter: drop-shadow(0 0 18px rgba(255,80,130,0.7));
    margin-bottom: 4px;
  }
  @keyframes heartBeat {
    0%,100% { transform: scale(1); }
    14%     { transform: scale(1.13); }
    28%     { transform: scale(1); }
    42%     { transform: scale(1.07); }
    56%     { transform: scale(1); }
  }

  #mainText {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(32px, 9vw, 52px);
    color: #ffd6eb;
    text-shadow: 0 0 30px rgba(255,100,170,0.8), 0 0 60px rgba(255,50,120,0.4);
    text-align: center;
    line-height: 1.25;
    animation: textAppear 1s ease both;
    margin-bottom: 12px;
  }
  @keyframes textAppear {
    from { opacity: 0; transform: scale(0.7); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* Карточки с комплиментами */
  #cards {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    max-width: 380px;
    margin-top: 8px;
  }
  .card {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(13px, 3.5vw, 16px);
    color: rgba(255,215,235,0.9);
    border: 1px solid rgba(255,150,200,0.3);
    border-radius: 40px;
    padding: 7px 16px;
    background: rgba(255,80,140,0.08);
    backdrop-filter: blur(4px);
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .card.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Нижний текст */
  #subText {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    font-size: clamp(11px, 3vw, 14px);
    color: rgba(255,200,225,0.5);
    text-align: center;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 18px;
    opacity: 0;
    animation: fadeIn 1s 2.5s ease forwards;
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* Частицы взрыва */
  .burst {
    position: fixed;
    font-size: 24px;
    pointer-events: none;
    z-index: 20;
    animation: burstOut 1.2s ease-out forwards;
  }
  @keyframes burstOut {
    0%   { transform: translate(-50%,-50%) scale(0); opacity: 1; }
    60%  { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--bx)), calc(-50% + var(--by))) scale(1); opacity: 0; }
  }
</style>
</head>
<body>

<canvas id="sky"></canvas>
<div id="moon"></div>

<!-- Экран 1 -->
<div id="screen1">
  <h1>Есть кое-что важное<br>что я хочу тебе сказать…</h1>
  <button id="startBtn">Открыть ✨</button>
</div>

<!-- Экран 2 -->
<div id="screen2">
  <svg id="heartSvg" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ff4d8d"/>
        <stop offset="100%" stop-color="#ff1744"/>
      </linearGradient>
    </defs>
    <path d="M50 80 C50 80 10 55 10 30 A20 20 0 0 1 50 25 A20 20 0 0 1 90 30 C90 55 50 80 50 80Z"
      fill="url(#hg)" stroke="rgba(255,120,160,0.4)" stroke-width="1"/>
    <!-- блик -->
    <ellipse cx="37" cy="34" rx="9" ry="6" fill="rgba(255,255,255,0.18)" transform="rotate(-30 37 34)"/>
  </svg>

  <div id="mainText">Я люблю тебя, Лиза</div>

  <div id="cards">
    <div class="card">Ты самая красивая ✨</div>
    <div class="card">Ты моё счастье 💕</div>
    <div class="card">Ты особенная 🌸</div>
    <div class="card">Ты моя любимая 🌹</div>
    <div class="card">Ты волшебная 💫</div>
    <div class="card">Ты прекрасная 🌺</div>
  </div>

  <div id="subText">навсегда твой &nbsp;•&nbsp; всегда рядом</div>
</div>

<script>
// ——— Звёздное небо ———
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
let stars = [];

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  stars = [];
  for (let i = 0; i < 200; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.5 + 0.3,
      a: Math.random(),
      speed: Math.random() * 0.008 + 0.002,
      phase: Math.random() * Math.PI * 2
    });
  }
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function drawStars(t) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const s of stars) {
    const alpha = 0.15 + 0.75 * (0.5 + 0.5 * Math.sin(s.phase + t * s.speed));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,245,255,${alpha})`;
    ctx.fill();
  }
}

let raf;
function loop(t) {
  drawStars(t * 0.001);
  raf = requestAnimationFrame(loop);
}
raf = requestAnimationFrame(loop);

// ——— Светлячки ———
function addFireflies() {
  for (let i = 0; i < 18; i++) {
    const f = document.createElement('div');
    f.className = 'fly';
    f.style.left = Math.random() * 95 + 'vw';
    f.style.top  = Math.random() * 85 + 'vh';
    const d = (Math.random() * 5 + 5).toFixed(1) + 's';
    const b = (Math.random() * 2 + 1.5).toFixed(1) + 's';
    const mx1 = (Math.random()*80-40)+'px', my1 = (Math.random()*80-40)+'px';
    const mx2 = (Math.random()*80-40)+'px', my2 = (Math.random()*80-40)+'px';
    const mx3 = (Math.random()*80-40)+'px', my3 = (Math.random()*80-40)+'px';
    f.style.cssText += `
      --mx1:${mx1};--my1:${my1};
      --mx2:${mx2};--my2:${my2};
      --mx3:${mx3};--my3:${my3};
      animation-duration:${d},${b};
      animation-delay:${(Math.random()*4).toFixed(1)}s,${(Math.random()*2).toFixed(1)}s;
    `;
    document.body.appendChild(f);
  }
}
addFireflies();

// ——— Лепестки ———
const petalSet = ['🌸','🌺','🌷','🌹','💮'];
function addPetals() {
  for (let i = 0; i < 22; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.innerText = petalSet[i % petalSet.length];
    const dur  = (Math.random() * 5 + 6).toFixed(1) + 's';
    const del  = (Math.random() * 7).toFixed(1) + 's';
    const sway = (Math.random() * 80 - 40).toFixed(0) + 'px';
    p.style.cssText = `
      left:${Math.random()*100}vw;
      --sway:${sway};
      animation-duration:${dur};
      animation-delay:${del};
    `;
    document.body.appendChild(p);
  }
}

// ——— Взрыв ———
function burst() {
  const emojis = ['❤️','💖','💗','💓','💕','✨','🌸','💝'];
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  for (let i = 0; i < 20; i++) {
    const b = document.createElement('div');
    b.className = 'burst';
    b.innerText = emojis[i % emojis.length];
    const angle = (i / 20) * Math.PI * 2;
    const dist  = 80 + Math.random() * 160;
    b.style.cssText = `
      left:${cx}px; top:${cy}px;
      --bx:${(Math.cos(angle)*dist).toFixed(0)}px;
      --by:${(Math.sin(angle)*dist).toFixed(0)}px;
      animation-delay:${(Math.random()*0.3).toFixed(2)}s;
    `;
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 1600);
  }
}

// ——— Карточки появляются поочерёдно ———
function revealCards() {
  const cards = document.querySelectorAll('.card');
  cards.forEach((c, i) => {
    setTimeout(() => c.classList.add('visible'), 400 + i * 220);
  });
}

// ——— Главная кнопка ———
document.getElementById('startBtn').addEventListener('click', function () {
  const s1 = document.getElementById('screen1');
  const s2 = document.getElementById('screen2');

  s1.style.opacity = '0';
  s1.style.pointerEvents = 'none';

  addPetals();

  setTimeout(() => {
    s1.style.display = 'none';
    s2.classList.add('show');
    burst();
    setTimeout(revealCards, 600);
  }, 900);
});
</script>
</body>
</html>
